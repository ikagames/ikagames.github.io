<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ikagames — mobile games studio. Home of IkaPop! and more.">
  <meta name="theme-color" content="#121420">
  <title>ikagames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121420;
      --ink: #f4f5f8;
      --muted: #b4b8c7;
      --brand: #3dcfbf;
      --accent: #ff7a45;
      --line: rgba(244, 245, 248, 0.14);
      --surface: rgba(255, 255, 255, 0.06);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f5f8;
        --ink: #161822;
        --muted: #555a6b;
        --brand: #0e766e;
        --accent: #e85d2c;
        --line: rgba(22, 24, 34, 0.12);
        --surface: rgba(18, 20, 32, 0.04);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(100% 70% at 0% 0%, rgba(61, 207, 191, 0.16), transparent 50%),
        radial-gradient(80% 60% at 100% 10%, rgba(255, 122, 69, 0.12), transparent 45%),
        var(--bg);
      line-height: 1.55;
    }

    a { color: var(--brand); }
    a:hover { color: var(--accent); }

    .wrap {
      width: min(100% - 2rem, 36rem);
      margin: 0 auto;
      padding: 18vh 0 3rem;
      animation: rise 0.7s ease both;
    }

    h1 {
      font-family: Outfit, sans-serif;
      font-weight: 800;
      font-size: clamp(2.6rem, 10vw, 4rem);
      letter-spacing: -0.04em;
      margin: 0;
      line-height: 0.95;
    }

    .lead {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 28rem;
    }

    .games {
      margin-top: 2.25rem;
      display: grid;
      gap: 0.85rem;
    }

    .game {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 1.15rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .game:hover {
      transform: translateY(-2px);
      border-color: var(--brand);
      color: inherit;
    }

    .game strong {
      display: block;
      font-family: Outfit, sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .game span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .meta {
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ikagames</h1>
    <p class="lead">Mobile games by ikagames. Each title has its own page, store link, and privacy policy.</p>

    <section class="games" aria-label="Games">
      <a class="game" href="ikapop/">
        <strong>IkaPop!</strong>
        <span>Vertical color-match puzzle on a looping 5×7 grid.</span>
      </a>
    </section>

    <footer class="meta">
      <p>Contact: <a href="mailto:ikagames.support@gmail.com">ikagames.support@gmail.com</a></p>
    </footer>
  </main>
</body>
</html>
